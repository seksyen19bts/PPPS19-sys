<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PPPS19 Management System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        html, body {
            width: 100vw;
            height: 100dvh;
            overflow: hidden;
            background-color: #0f172a;
        }

        /* Fixed Navigation Header */
        #top-bar {
            display: flex;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 50px;
            background-color: #1e293b;
            border-bottom: 1px solid #334155;
            z-index: 1000;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
        }

        #menu-toggle {
            background: #334155;
            border: none;
            font-size: 1.2rem;
            cursor: pointer;
            color: #f8fafc;
            padding: 6px 12px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.2s ease, transform 0.1s ease;
        }

        #menu-toggle:active {
            background-color: #475569;
            transform: scale(0.95);
        }

        .bar-title {
            font-weight: 600;
            font-size: 1rem;
            color: #f8fafc;
        }

        .logout-btn {
            background-color: #ef4444;
            color: #ffffff;
            border: none;
            padding: 6px 14px;
            font-size: 0.85rem;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .logout-btn:active {
            background-color: #dc2626;
        }

        /* Launch Overlay */
        #launch-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100dvh;
            background: rgba(15, 23, 42, 0.98);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 9999;
        }

        .card {
            background: #1e293b;
            padding: 30px 24px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 360px;
            border: 1px solid #334155;
            text-align: center;
        }

        .title { color: #f8fafc; font-size: 1.25rem; font-weight: 600; margin-bottom: 8px; }
        .subtitle { color: #94a3b8; font-size: 0.875rem; margin-bottom: 24px; }

        .launch-btn {
            width: 100%;
            padding: 14px;
            background-color: #2563eb;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
        }

        /* Main Application Iframe Container */
        #app-frame {
            position: fixed;
            top: 50px;
            left: 0;
            width: 100vw;
            height: calc(100dvh - 50px);
            border: none;
            display: none;
        }
    </style>
</head>
<body>

    <!-- Top Navigation Header -->
    <div id="top-bar">
        <button id="menu-toggle" onclick="toggleMobileDrawer()" title="Toggle Mobile Menu">☰ Menu</button>
        <div class="bar-title">PPPS19 Portal</div>
        <button class="logout-btn" onclick="handleLogout()">Logout</button>
    </div>

    <!-- Start Screen Overlay -->
    <div id="launch-overlay">
        <div class="card">
            <div class="title">PPPS19 Portal</div>
            <div class="subtitle">Tap below to launch the system.</div>
            <button class="launch-btn" onclick="launchApp()">Enter Management System</button>
        </div>
    </div>

    <!-- Application Iframe -->
    <iframe 
        id="app-frame"
        src="https://script.google.com/macros/s/AKfycbz01R8xI7lDuqoRNQpttX2eB2hKAiDcoXZCcso-xUJCmgx2y6wB3sMTq2CkfLu9tHQ/exec"
        allow="fullscreen">
    </iframe>

<script>
    const APP_URL = "https://script.google.com/macros/s/AKfycbz01R8xI7lDuqoRNQpttX2eB2hKAiDcoXZCcso-xUJCmgx2y6wB3sMTq2CkfLu9tHQ/exec";

    let TOKEN =
 localStorage.getItem(
  'ppps19_token'
 ) || '';

let STATE = null;

let CURRENT_PAGE = 'dashboard';
    
    function toggleIframeDrawer() {
    const iframe = document.getElementById('app-frame');
    if (iframe && iframe.contentWindow) {
      // Send toggle message down into the child iframe
      iframe.contentWindow.postMessage({ action: 'toggleDrawer' }, '*');
    }
  }
    
    function launchApp() {
        const container = document.documentElement;
        const iframe = document.getElementById('app-frame');
        const overlay = document.getElementById('launch-overlay');

        if (container.requestFullscreen) {
            container.requestFullscreen().catch(err => console.log(err));
        } else if (container.webkitRequestFullscreen) {
            container.webkitRequestFullscreen();
        }

        overlay.style.display = 'none';
        iframe.style.display = 'block';
    }

    function reloadFrame() {
        const iframe = document.getElementById('app-frame');
        if (iframe) {
            // Re-assigning URL forces the frame to reset/reload cleanly
            iframe.src = APP_URL;
        }
    }

    function handleLogout() {
        if (document.fullscreenElement || document.webkitFullscreenElement) {
            if (document.exitFullscreen) {
                document.exitFullscreen().catch(err => console.log(err));
            } else if (document.webkitExitFullscreen) {
                document.webkitExitFullscreen();
            }
        }
        window.location.reload();
    }

    /* =========================================================
   MOBILE DRAWER & CROSS-FRAME LISTENERS (FIX IMPLEMENTED)
   ========================================================= */

function toggleMobileDrawer(){

 const drawer =
  document.getElementById('mobileDrawer');

 const backdrop =
  document.getElementById('mobileDrawerBackdrop');

 const button =
  document.getElementById('mobileMenuButton');

 if(!drawer || !backdrop || !button)return;

 const isOpen =
  drawer.classList.toggle('mobile-drawer-open');

 backdrop.classList.toggle(
  'mobile-drawer-visible',
  isOpen
 );

 button.setAttribute(
  'aria-expanded',
  isOpen ? 'true' : 'false'
 );

 button.setAttribute(
  'aria-label',
  isOpen ? 'Tutup menu' : 'Buka menu'
 );

 button.textContent =
  isOpen ? '✕' : '☰';

 document.body.style.overflow =
  isOpen ? 'hidden' : '';
}


function closeMobileDrawer(){

 const drawer =
  document.getElementById('mobileDrawer');

 const backdrop =
  document.getElementById('mobileDrawerBackdrop');

 const button =
  document.getElementById('mobileMenuButton');

 if(!drawer || !backdrop || !button)return;

 drawer.classList.remove(
  'mobile-drawer-open'
 );

 backdrop.classList.remove(
  'mobile-drawer-visible'
 );

 button.setAttribute(
  'aria-expanded',
  'false'
 );

 button.setAttribute(
  'aria-label',
  'Buka menu'
 );

 button.textContent = '☰';

 document.body.style.overflow = '';
}


/* Cross-origin message listener from Github pages (index.html) */
window.addEventListener('message', function(event) {
 if (event.data && event.data.action === 'toggleDrawer') {
  toggleMobileDrawer();
 }
});


document.addEventListener(
 'click',
 function(e){

  if(
   window.innerWidth <= 768 &&
   e.target.closest('#nav button')
  ){
   closeMobileDrawer();
  }

 }
);


document.addEventListener(
 'keydown',
 function(e){

  if(
   e.key === 'Escape' &&
   window.innerWidth <= 768
  ){
   closeMobileDrawer();
  }

 }
);


window.addEventListener(
 'resize',
 function(){

  if(window.innerWidth > 768){
   closeMobileDrawer();
  }

 }
);


/* =====================================================
 GOOGLE APPS SCRIPT API WRAPPER
====================================================== */

function call(fn,...args){

 return new Promise(
  function(resolve,reject){

   if(
    typeof google === 'undefined' ||
    !google.script ||
    !google.script.run
   ){

    reject(
     new Error(
      'Google Apps Script tidak tersedia. Pastikan index.html dijalankan melalui Web App Apps Script.'
     )
    );

    return;
   }

   google.script.run
    .withSuccessHandler(
     function(response){

      resolve(response);

     }
    )
    .withFailureHandler(
     function(error){

      reject(
       error instanceof Error
        ? error
        : new Error(
           error &&
           error.message
            ? error.message
            : String(error)
          )
      );

     }
    )[fn](...args);

  }
 );

}


/* =====================================================
 UTILITIES
====================================================== */

function esc(v){

 return String(v ?? '')
  .replace(
   /[&<>"']/g,
   function(m){

    return {
     '&':'&amp;',
     '<':'&lt;',
     '>':'&gt;',
     '"':'&quot;',
     "'":'&#039;'
    }[m];

   }
  );

}


function money(v){

 const n =
  Number(v || 0);

 return 'RM ' +
  n.toFixed(2);

}


function showError(
 el,
 msg
){

 const target =
  document.getElementById(el);

 if(!target)return;

 target.innerHTML =
  '<div class="alert">' +
  esc(msg) +
  '</div>';

}


function showSuccess(
 el,
 msg
){

 const target =
  document.getElementById(el);

 if(!target)return;

 target.innerHTML =
  '<div class="success">' +
  esc(msg) +
  '</div>';

}


function loading(text){

 return `
  <div class="loading">
   <span class="spinner"></span>
   ${esc(text || 'Memuatkan...')}
  </div>
 `;

}


/* =====================================================
 LOGIN
====================================================== */

async function doLogin(){

 const email =
  document
   .getElementById('email')
   .value
   .trim();

 const password =
  document
   .getElementById('password')
   .value;

 if(!email || !password){

  showError(
   'loginError',
   'Sila masukkan email dan password.'
  );

  return;
 }

 const button =
  document.getElementById(
   'loginButton'
  );

 button.disabled = true;
 button.textContent =
  'Sedang log masuk...';

 document.getElementById(
  'loginError'
 ).innerHTML = '';

 try{

  const r =
   await call(
    'login',
    email,
    password
   );

  console.log(
   'LOGIN RESPONSE:',
   r
  );

  if(!r){

   throw new Error(
    'Server tidak mengembalikan response.'
   );

  }

  if(r.ok !== true){

   throw new Error(
    r.message ||
    'Email atau password tidak sah.'
   );

  }

  if(
   typeof r.token !== 'string' ||
   !r.token
  ){

   throw new Error(
    'Server tidak mengembalikan session token.'
   );

  }

  TOKEN =
   r.token;

  localStorage.setItem(
   'ppps19_token',
   TOKEN
  );

  await loadPortal();

 }catch(e){

  console.error(
   'LOGIN ERROR:',
   e
  );

  showError(
   'loginError',
   e.message ||
   'Login gagal.'
  );

 }finally{

  button.disabled = false;
  button.textContent =
   'Log Masuk';

 }

}


/* =====================================================
 LOAD PORTAL
====================================================== */

async function loadPortal(){

 if(!TOKEN){

  showLogin();

  return;
 }

 document.getElementById(
  'content'
 ).innerHTML =
  loading(
   'Memuatkan portal...'
  );

 try{

  const r =
   await call(
    'getPortal',
    TOKEN
   );

  console.log(
   'PORTAL RESPONSE:',
   r
  );

  if(!r){

   throw new Error(
    'Server tidak mengembalikan response.'
   );

  }

  if(r.ok !== true){

   throw new Error(
    r.message ||
    'Session tidak sah.'
   );

  }

  if(!r.user){

   throw new Error(
    'Server tidak mengembalikan maklumat user.'
   );

  }

  STATE = r;

  renderShell();

  show(
   CURRENT_PAGE ||
   'dashboard'
  );

 }catch(e){

  console.error(
   'LOAD PORTAL ERROR:',
   e
  );

  TOKEN = '';

  STATE = null;

  localStorage.removeItem(
   'ppps19_token'
  );

  showLogin();

  showError(
   'loginError',
   e.message ||
   'Session telah tamat. Sila login semula.'
  );

 }

}

 SHOW LOGIN
====================================================== */

 document
  .getElementById('app')

  );

  .getElementById('login')
  .classList.remove(

  );

 STATE = null;

  document.getElementById(
   'password'
  );

 if(password){
  password.value = '';
 }

 const email =
  document.getElementById(
   'email'
  );

 if(email){
  email.focus();
 }

}


/* =====================================================
 LOGOUT
====================================================== */

async function doLogout(){

 try{

  if(TOKEN){

   await call(
    'logout',
    TOKEN
   );

  }

 }catch(e){

  console.warn(
   'LOGOUT ERROR:',
   e
  );

 }finally{

  TOKEN = '';

  STATE = null;

  localStorage.removeItem(
   'ppps19_token'
  );

  showLogin();

 }

}

async function requestResetCode(){

 const email =
  document
   .getElementById(
    'resetEmail'
   )
   .value
   .trim();

 if(!email){

  showError(
   'resetRequestMsg',
   'Sila masukkan email.'
  );

  return;
 }

 try{

  const r =
   await call(
    'requestPasswordReset',
    email
   );

  if(!r){

   throw new Error(
    'Server tidak mengembalikan response.'
   );

  }

  if(r.ok === false){

   throw new Error(
    r.message ||
    'Permintaan reset gagal.'
   );

  }

  document.getElementById(
   'resetRequestMsg'
  ).innerHTML =
   '<div class="success">' +
   esc(
    r.message ||
    'Kod reset telah dihantar.'
   ) +
   '</div>';

  setTimeout(
   function(){

    showCompleteReset(
     email
    );

   },
   700
  );

 }catch(e){

  showError(
   'resetRequestMsg',
   e.message ||
   e
  );

 }

}


function showCompleteReset(
 email
){

 openModal(`

  <h3>Reset Password</h3>

  <p class="muted">
   Masukkan kod reset yang diterima
   dan password baru.
  </p>

  <div id="completeResetMsg"></div>

  <label>Email</label>

  <input
   id="completeEmail"
   value="${esc(email)}"
   readonly
  >

  <label>Kod Reset</label>

  <input
   id="resetCode"
   maxlength="6"
   inputmode="numeric"
   placeholder="123456"
  >

  <label>Password Baru</label>

  <input
   id="resetNewPassword"
   type="password"
   minlength="8"
  >

  <label>Sahkan Password Baru</label>

  <input
   id="resetConfirmPassword"
   type="password"
   minlength="8"
  >

  <div class="actions">

   <button
    class="btn secondary"
    onclick="closeModal()"
   >
    Batal
   </button>

   <button
    class="btn"
    onclick="completeReset()"
   >
    Reset Password
   </button>

  </div>

 `);

}


async function completeReset(){

 const email =
  document
   .getElementById(
    'completeEmail'
   )
   .value
   .trim();

 const code =
  document
   .getElementById(
    'resetCode'
   )
   .value
   .trim();

 const password =
  document
   .getElementById(
    'resetNewPassword'
   )
   .value;

 const confirm =
  document
   .getElementById(
    'resetConfirmPassword'
   )
   .value;

 if(!email || !code || !password){

  showError(
   'completeResetMsg',
   'Semua ruangan wajib diisi.'
  );

  return;
 }

 if(password.length < 8){

  showError(
   'completeResetMsg',
   'Password mestilah sekurang-kurangnya 8 aksara.'
  );

  return;
 }

 if(password !== confirm){

  showError(
   'completeResetMsg',
   'Password baru tidak sepadan.'
  );

  return;
 }

 try{

  const r =
   await call(
    'completePasswordReset',
    email,
    code,
    password
   );

  if(!r){

   throw new Error(
    'Server tidak mengembalikan response.'
   );

  }

  if(r.ok === false){

   throw new Error(
    r.message ||
    'Reset password gagal.'
   );

  }

  showSuccess(
   'completeResetMsg',
   r.message ||
   'Password berjaya ditukar.'
  );

  setTimeout(
   function(){

    closeModal();

    document
     .getElementById(
      'email'
     ).value =
      email;

    document
     .getElementById(
      'password'
     ).value =
      '';

    document
     .getElementById(
      'password'
     ).focus();

   },
   1000
  );

 }catch(e){

  showError(
   'completeResetMsg',
   e.message ||
   e
  );

 }

}

async function saveMyPassword(){

 const current =
  document.getElementById(
   'currentPassword'
  ).value;

 const password =
  document.getElementById(
   'newPassword'
  ).value;

 const confirm =
  document.getElementById(
   'confirmNewPassword'
  ).value;

 if(!current || !password){

  showError(
   'changePasswordMsg',
   'Sila lengkapkan semua ruangan.'
  );

  return;
 }

 if(password.length < 8){

  showError(
   'changePasswordMsg',
   'Password mestilah sekurang-kurangnya 8 aksara.'
  );

  return;
 }

 if(password !== confirm){

  showError(
   'changePasswordMsg',
   'Password baru tidak sepadan.'
  );

  return;
 }

 try{

  const r =
   await call(
    'changeMyPassword',
    TOKEN,
    current,
    password
   );

  if(!r){

   throw new Error(
    'Server tidak mengembalikan response.'
   );

  }

  if(r.ok === false){

   throw new Error(
    r.message ||
    'Pertukaran password gagal.'
   );

   'changePasswordMsg',
   r.message ||
   'Password berjaya ditukar.'
  );

 }catch(e){

  showError(
   'changePasswordMsg',
   e.message ||
   e
  );

 }

}


/* =====================================================
 RENDER SHELL
====================================================== */

function renderShell(){

 if(!STATE || !STATE.user){

  showLogin();

  return;
 }

 document
  .getElementById('login')
  .classList.add(
   'hidden'
  );

 document
  .getElementById('app')
  .classList.remove(
   'hidden'
  );

 document
  .getElementById('who')
  .textContent =
   STATE.user.EMAIL +
   ' • ' +
   STATE.user.ROLE;

 const role =
  STATE.user.ROLE;

 const nav =
  document.getElementById(
   'nav'
  );

 let html = `

  <button onclick="show('dashboard')">
   🏠 Dashboard
  </button>

  <button onclick="show('profile')">
   👤 Keahlian Saya
  </button>

  <button onclick="show('payments')">
   💳 Bayaran
  </button>

  </button>

 if([
  'SUPER_ADMIN',

   </button>

   </button>

  `;

}


/* =====================================================
 ROUTER
====================================================== */

async function show(page){

 CURRENT_PAGE =
  page;

 const c =
  document.getElementById(
   'content'
  );

 if(!STATE || !STATE.user){

  showLogin();

  return;
 }

 try{

  if(page === 'dashboard'){

   c.innerHTML =
    dashboard();

  }

  else if(page === 'profile'){

   await profile();

  }

  else if(page === 'payments'){

   await payments();

  }

  else if(page === 'receipts'){

   await receipts();

  }

  else if(page === 'members'){

   await members();

  }

  else if(page === 'allpayments'){

   await allPayments();

  }

  else if(page === 'audit'){

   await audit();

  }

  else if(page === 'users'){

   await users();

  }

  else if(page === 'auditlog'){

   await auditLog();

  }

  else if(page === 'health'){

   await health();

  }

 }catch(e){

  console.error(
   'PAGE ERROR:',
   e
  );

  c.innerHTML =
   '<div class="alert">' +
   esc(
    e.message ||
    'Gagal memuatkan halaman.'
   ) +
   '</div>';

 }

}

async function saveAdminReset(
 userId
){

 const password =
  document.getElementById(
   'adminNewPassword'
  ).value;

 const confirm =
  document.getElementById(
   'adminConfirmPassword'
  ).value;

 if(password.length < 8){

  showError(
   'adminResetMsg',
   'Password mestilah sekurang-kurangnya 8 aksara.'
  );

  return;
 }

 if(password !== confirm){

  showError(
   'adminResetMsg',
   'Password tidak sepadan.'
  );

  return;
 }

 try{

  const r =
   await call(
    'resetUserPassword',
    TOKEN,
    userId,
    password
   );

  if(!r){

   throw new Error(
    'Server tidak mengembalikan response.'
   );

  }

  if(r.ok === false){

   throw new Error(
    r.message ||
    'Reset password gagal.'
   );

  }

  showSuccess(
   'adminResetMsg',
   r.message ||
   'Password berjaya direset.'
  );

 }catch(e){

  showError(
   'adminResetMsg',
   e.message ||
   e
  );

 }

}

/* =========================================================
   MOBILE DRAWER & CROSS-FRAME LISTENERS
   ========================================================= */

function toggleMobileDrawer() {
  const drawer = document.getElementById('mobileDrawer');
  const backdrop = document.getElementById('mobileDrawerBackdrop');
  const button = document.getElementById('mobileMenuButton');

  if (!drawer) return;

  // Force toggle open class
  const isOpen = drawer.classList.toggle('mobile-drawer-open');

  if (backdrop) {
    backdrop.classList.toggle('mobile-drawer-visible', isOpen);
  }

  if (button) {
    button.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
    button.textContent = isOpen ? '✕' : '☰';
  }

  document.body.style.overflow = isOpen ? 'hidden' : '';
}

function closeMobileDrawer() {
  const drawer = document.getElementById('mobileDrawer');
  const backdrop = document.getElementById('mobileDrawerBackdrop');
  const button = document.getElementById('mobileMenuButton');

  if (drawer) drawer.classList.remove('mobile-drawer-open');
  if (backdrop) backdrop.classList.remove('mobile-drawer-visible');
  if (button) {
    button.setAttribute('aria-expanded', 'false');
    button.textContent = '☰';
  }

  document.body.style.overflow = '';
}

/* LISTEN TO PARENT FRAME COMMANDS (from index.html) */
window.addEventListener('message', function(event) {
  if (event.data && event.data.action === 'toggleDrawer') {
    toggleMobileDrawer();
  }
});
