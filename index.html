<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PPPS19 Management System</title>

<style>
:root{
 --bg:#f5f7fb;
 --card:#fff;
 --text:#182230;
 --muted:#687386;
 --primary:#173b72;
 --line:#e5e9f0;
 --ok:#18794e;
 --danger:#b42318;
 --warning:#9a6700
}

*{box-sizing:border-box}

body{
 margin:0;
 font-family:Arial,Helvetica,sans-serif;
 background:var(--bg);
 color:var(--text)
}

button,input,select,textarea{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}

.login{
 min-height:100vh;
 display:grid;
 place-items:center;
 padding:24px;
 background:linear-gradient(135deg,#102c57,#23518f)
}

.login-card{
 width:min(440px,100%);
 background:#fff;
 border-radius:18px;
 padding:30px;
 box-shadow:0 20px 50px #0003
}

.brand{
 font-weight:800;
 color:var(--primary)
}

h1,h2,h3{margin-top:0}

.muted{color:var(--muted)}

label{
 display:block;
 font-weight:700;
 font-size:13px;
 margin:12px 0 6px
}

input,select,textarea{
 width:100%;
 padding:11px 12px;
 border:1px solid #d5dbe5;
 border-radius:10px;
 background:#fff
}

textarea{
 min-height:100px;
 resize:vertical
}

.btn{
 border:0;
 border-radius:10px;
 padding:11px 15px;
 background:var(--primary);
 color:#fff;
 font-weight:700
}

.btn.secondary{
 background:#eef2f7;
 color:var(--text)
}

.btn.danger{
 background:var(--danger);
 color:#fff
}

.btn.warning{
 background:#fff3cd;
 color:#664d03
}

.btn:disabled{
 opacity:.6;
 cursor:not-allowed
}

.alert{
 padding:11px;
 border-radius:10px;
 margin:12px 0;
 background:#fff0f0;
 color:var(--danger)
}

.success{
 padding:11px;
 border-radius:10px;
 margin:12px 0;
 background:#e8f6ef;
 color:var(--ok)
}

.app{
 min-height:100vh
}

.top{
 height:64px;
 background:#fff;
 border-bottom:1px solid var(--line);
 display:flex;
 align-items:center;
 justify-content:space-between;
 padding:0 20px;
 position:sticky;
 top:0;
 z-index:3
}

.layout{
 display:flex
}

.side{
 width:230px;
 background:#fff;
 border-right:1px solid var(--line);
 min-height:calc(100vh - 64px);
 padding:15px;
 position:fixed;
 top:64px;
 bottom:0;
 overflow:auto
}

.main{
 margin-left:230px;
 padding:24px;
 width:calc(100% - 230px)
}

.nav button{
 width:100%;
 text-align:left;
 background:transparent;
 border:0;
 padding:11px;
 border-radius:99px;
 margin-bottom:4px
}

.nav button:hover{
 background:#eef3fa
}

.grid{
 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:14px
}

.card{
 background:var(--card);
 border:1px solid var(--line);
 border-radius:14px;
 padding:18px
}

.metric{
 font-size:25px;
 font-weight:800;
 margin-top:8px
}

.toolbar{
 display:flex;
 gap:8px;
 justify-content:space-between;
 align-items:center;
 margin-bottom:14px;
 flex-wrap:wrap
}

.table-wrap{
 overflow:auto;
 border:1px solid var(--line);
 border-radius:12px
}

table{
 width:100%;
 border-collapse:collapse;
 background:#fff
}

th,td{
 padding:10px;
 border-bottom:1px solid var(--line);
 font-size:13px;
 text-align:left;
 white-space:nowrap
}

th{
 background:#f7f9fc
}

.badge{
 display:inline-block;
 padding:4px 8px;
 border-radius:99px;
 background:#eef2f7;
 font-size:12px;
 font-weight:700
}

.badge.ok{
 background:#e8f6ef;
 color:var(--ok)
}

.badge.danger{
 background:#fff0f0;
 color:var(--danger)
}

.modal{
 position:fixed;
 inset:0;
 background:#0006;
 display:grid;
 place-items:center;
 padding:20px;
 z-index:10
}

.modal-box{
 background:#fff;
 border-radius:15px;
 padding:20px;
 width:min(700px,100%);
 max-height:90vh;
 overflow:auto
}

.form-grid{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:12px
}

.full{
 grid-column:1/-1
}

.actions{
 display:flex;
 gap:8px;
 justify-content:flex-end;
 margin-top:18px
}

.login-links{
 display:flex;
 justify-content:space-between;
 gap:8px;
 margin-top:14px
}

.login-links button{
 border:0;
 background:none;
 color:var(--primary);
 font-weight:700;
 padding:5px
}

.health-ok{
 color:var(--ok);
 font-weight:700
}

.health-error{
 color:var(--danger);
 font-weight:700
}

.loading{
 padding:30px;
 text-align:center;
 color:var(--muted)
}

.spinner{
 display:inline-block;
 width:18px;
 height:18px;
 border:3px solid #dbe3ef;
 border-top-color:var(--primary);
 border-radius:50%;
 animation:spin .8s linear infinite;
 vertical-align:middle;
 margin-right:8px
}

@keyframes spin{
 to{transform:rotate(360deg)}
}

.top-actions{
 display:flex;
 align-items:center;
 gap:8px
}


/* =========================================================
   MOBILE DRAWER / RESPONSIVE LAYOUT
   ========================================================= */

.mobile-menu-btn{
 display:none;
 border:0;
 background:transparent;
 color:var(--primary);
 font-size:24px;
 line-height:1;
 width:42px;
 height:42px;
 border-radius:10px;
 align-items:center;
 justify-content:center;
 cursor:pointer;
 flex:0 0 42px;
}

.mobile-menu-btn:active{
 background:#eef3fa;
}

.mobile-drawer-backdrop{
 display:none;
}

@media(max-width:1100px) and (min-width:769px){
 .side{
  width:210px;
 }
 .main{
  margin-left:210px;
  width:calc(100% - 210px);
 }
 .grid{
  grid-template-columns:repeat(2,1fr);
 }
}

@media(max-width:768px){
 html, body{
  width:100%;
  max-width:100%;
  overflow-x:hidden;
  -webkit-text-size-adjust:100%;
 }
 body{
  min-height:100dvh;
 }

 .top{
  position:sticky;
  top:0;
  z-index:30;
  min-height:58px;
  height:auto;
  padding: max(8px,env(safe-area-inset-top)) 10px 8px 10px;
  gap:8px;
  flex-wrap:nowrap;
 }

 .mobile-menu-btn{
  display:flex;
 }

 .top .brand{
  min-width:0;
  flex:1 1 auto;
  font-size:15px;
  line-height:1.2;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
 }

 .top-actions{
  width:auto;
  flex:0 0 auto;
  gap:5px;
 }

 .top-actions #who{
  display:none;
 }

 .top-actions .btn{
  min-height:40px;
  min-width:40px;
  padding:8px 10px;
  font-size:0;
 }

 .top-actions .btn:first-of-type::after{
  content:'🔑';
  font-size:16px;
 }

 .top-actions .btn:last-of-type::after{
  content:'↪';
  font-size:19px;
 }

 .layout{
  display:block;
  width:100%;
 }

 .side{
  position:fixed;
  z-index:50;
  top:0;
  left:0;
  bottom:0;
  width:min(84vw,320px);
  height:100dvh;
  min-height:0;
  padding: calc(66px + env(safe-area-inset-top)) 12px calc(18px + env(safe-area-inset-bottom)) 12px;
  display:block;
  overflow-y:auto;
  overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  background:#fff;
  border-right:1px solid var(--line);
  box-shadow:14px 0 35px #0003;
  transform:translateX(-105%);
  transition:transform .22s ease;
  visibility:hidden;
 }

 .side.mobile-drawer-open{
  transform:translateX(0);
  visibility:visible;
 }

 .nav{
  width:100%;
 }

 .nav button{
  width:100%;
  min-height:46px;
  padding:12px 13px;
  margin-bottom:5px;
  text-align:left;
  font-size:14px;
  border-radius:10px;
 }

 .mobile-drawer-backdrop{
  display:block;
  position:fixed;
  z-index:40;
  inset:0;
  background:#0006;
  opacity:0;
  visibility:hidden;
  pointer-events:none;
  transition:opacity .2s ease;
 }

 .mobile-drawer-backdrop.mobile-drawer-visible{
  opacity:1;
  visibility:visible;
  pointer-events:auto;
 }

 .main{
  margin:0;
  width:100%;
  max-width:100%;
  min-width:0;
  padding: 14px 11px calc(24px + env(safe-area-inset-bottom));
 }

 #content{
  width:100%;
  min-width:0;
 }

 h2{ font-size:21px; line-height:1.25; }
 h3{ font-size:17px; }

 .grid{
  grid-template-columns:1fr;
  gap:10px;
 }

 .card{
  padding:14px;
  border-radius:12px;
  min-width:0;
 }

 .metric{ font-size:23px; }

 .toolbar{
  align-items:stretch;
  gap:9px;
 }

 .toolbar h2{
  width:100%;
  margin-bottom:0;
 }

 .toolbar > .btn{
  width:100%;
 }

 .form-grid{
  grid-template-columns:1fr;
  gap:9px;
 }

 .full{
  grid-column:auto;
 }

 input, select, textarea{
  width:100%;
  max-width:100%;
  min-height:44px;
  font-size:16px;
  box-sizing:border-box;
 }

 textarea{
  min-height:110px;
 }

 .actions{
  display:grid;
  grid-template-columns:1fr;
  gap:8px;
 }

 .actions .btn{
  width:100%;
 }

 .btn{
  min-height:44px;
  padding:10px 13px;
 }

 .table-wrap{
  width:100%;
  max-width:100%;
  overflow-x:auto;
  overflow-y:hidden;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:thin;
 }

 table{
  min-width:620px;
 }

 th, td{
  padding:9px 10px;
  font-size:12px;
 }

 .modal{
  align-items:flex-end;
  padding:0;
 }

 .modal-box{
  width:100%;
  max-width:none;
  max-height:92dvh;
  margin:0;
  border-radius:18px 18px 0 0;
  padding: 18px 14px calc(18px + env(safe-area-inset-bottom));
  overflow:auto;
  -webkit-overflow-scrolling:touch;
 }

 .login{
  min-height:100vh;
  min-height:100dvh;
  padding:16px 12px;
 }

 .login-card{
  width:100%;
  max-width:440px;
  padding:24px 17px;
  border-radius:16px;
 }

 .login-card h1{ font-size:25px; line-height:1.2; }
 .login-card input{ min-height:46px; }
 .login-card .btn{ min-height:46px; }
}

@media(max-width:420px){
 .top{ padding-left:7px; padding-right:7px; }
 .mobile-menu-btn{ width:40px; height:40px; flex-basis:40px; font-size:22px; }
 .top .brand{ font-size:14px; }
 .top-actions .btn{ width:40px; min-width:40px; padding:8px; }
 .main{ padding-left:9px; padding-right:9px; }
 .login-card{ padding:22px 15px; }
}

@media(min-width:769px){
 .mobile-menu-btn, .mobile-drawer-backdrop{
  display:none!important;
 }
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="login" class="login">
 <div class="login-card">
  <div class="brand">PPPS19</div>
  <h1>Portal Pengurusan</h1>
  <p class="muted">
   PERSATUAN PEMILIK HARTANAH DAN PENDUDUK
   SEKSYEN 19 BANDAR TASIK SENANGIN
   NEGERI SEMBILAN
  </p>
  <div id="loginError"></div>
  <label>Email</label>
  <input id="email" type="email" autocomplete="username" placeholder="nama@email.com">
  <label>Password</label>
  <input id="password" type="password" autocomplete="current-password" placeholder="Password" onkeydown="if(event.key==='Enter')doLogin()">
  <button id="loginButton" class="btn" style="width:100%;margin-top:16px" onclick="doLogin()">Log Masuk</button>
  <div class="login-links">
   <button onclick="forgotPassword()">Lupa Password?</button>
  </div>
 </div>
</div>

<!-- APP -->
<div id="app" class="app hidden">
 <div class="top">
  <button id="mobileMenuButton" class="mobile-menu-btn" onclick="toggleMobileDrawer()" aria-label="Buka menu" aria-expanded="false">☰</button>
  <div class="brand">PPPS19 Management System</div>
  <div class="top-actions">
   <span id="who" class="muted"></span>
   <button class="btn secondary" onclick="changePassword()">Tukar Password</button>
   <button class="btn secondary" onclick="doLogout()">Log Keluar</button>
  </div>
 </div>

 <div class="layout">
  <div id="mobileDrawerBackdrop" class="mobile-drawer-backdrop" onclick="closeMobileDrawer()"></div>
  <aside class="side" id="mobileDrawer">
   <div class="nav" id="nav"></div>
  </aside>
  <main class="main">
   <div id="content"></div>
  </main>
 </div>
</div>

<!-- MODAL -->
<div id="modal" class="modal hidden" onclick="if(event.target===this)closeModal()">
 <div class="modal-box">
  <div id="modalContent"></div>
 </div>
</div>

<script>
/* =====================================================
 GLOBAL STATE & CROSS-ORIGIN LISTENERS
====================================================== */
let TOKEN = localStorage.getItem('ppps19_token') || '';
let STATE = null;
let CURRENT_PAGE = 'dashboard';

// Listen to postMessage from parent iframe wrapper
window.addEventListener('message', function(event) {
  if (event.data === 'toggleSidebar' || (event.data && event.data.action === 'toggleSidebar')) {
    toggleMobileDrawer();
  }
});

/* =========================================================
   MOBILE DRAWER
========================================================= */
function toggleMobileDrawer(){
 const drawer = document.getElementById('mobileDrawer');
 const backdrop = document.getElementById('mobileDrawerBackdrop');
 const button = document.getElementById('mobileMenuButton');

 if(!drawer || !backdrop || !button) return;

 const isOpen = drawer.classList.toggle('mobile-drawer-open');

 backdrop.classList.toggle('mobile-drawer-visible', isOpen);
 button.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
 button.setAttribute('aria-label', isOpen ? 'Tutup menu' : 'Buka menu');
 button.textContent = isOpen ? '✕' : '☰';
 document.body.style.overflow = isOpen ? 'hidden' : '';
}

function closeMobileDrawer(){
 const drawer = document.getElementById('mobileDrawer');
 const backdrop = document.getElementById('mobileDrawerBackdrop');
 const button = document.getElementById('mobileMenuButton');

 if(!drawer || !backdrop || !button) return;

 drawer.classList.remove('mobile-drawer-open');
 backdrop.classList.remove('mobile-drawer-visible');
 button.setAttribute('aria-expanded', 'false');
 button.setAttribute('aria-label', 'Buka menu');
 button.textContent = '☰';
 document.body.style.overflow = '';
}

document.addEventListener('click', function(e){
  if(window.innerWidth <= 768 && e.target.closest('#nav button')){
   closeMobileDrawer();
  }
});

document.addEventListener('keydown', function(e){
  if(e.key === 'Escape' && window.innerWidth <= 768){
   closeMobileDrawer();
  }
});

window.addEventListener('resize', function(){
  if(window.innerWidth > 768){
   closeMobileDrawer();
  }
});

/* =====================================================
 GOOGLE APPS SCRIPT API WRAPPER
====================================================== */
function call(fn,...args){
 return new Promise(function(resolve,reject){
   if(typeof google === 'undefined' || !google.script || !google.script.run){
    reject(new Error('Google Apps Script tidak tersedia. Pastikan index.html dijalankan melalui Web App Apps Script.'));
    return;
   }
   google.script.run
    .withSuccessHandler(function(response){ resolve(response); })
    .withFailureHandler(function(error){
      reject(error instanceof Error ? error : new Error(error && error.message ? error.message : String(error)));
    })[fn](...args);
 });
}

/* =====================================================
 UTILITIES
====================================================== */
function esc(v){
 return String(v ?? '').replace(/[&<>"']/g, function(m){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m];
 });
}

function money(v){
 const n = Number(v || 0);
 return 'RM ' + n.toFixed(2);
}

function showError(el, msg){
 const target = document.getElementById(el);
 if(!target) return;
 target.innerHTML = '<div class="alert">' + esc(msg) + '</div>';
}

function showSuccess(el, msg){
 const target = document.getElementById(el);
 if(!target) return;
 target.innerHTML = '<div class="success">' + esc(msg) + '</div>';
}

function loading(text){
 return `
  <div class="loading">
   <span class="spinner"></span>
   ${esc(text || 'Memuatkan...')}
  </div>
 `;
}

/* =====================================================
 LOGIN
====================================================== */
async function doLogin(){
 const email = document.getElementById('email').value.trim();
 const password = document.getElementById('password').value;

 if(!email || !password){
  showError('loginError', 'Sila masukkan email dan password.');
  return;
 }

 const button = document.getElementById('loginButton');
 button.disabled = true;
 button.textContent = 'Sedang log masuk...';
 document.getElementById('loginError').innerHTML = '';

 try{
  const r = await call('login', email, password);
  if(!r) throw new Error('Server tidak mengembalikan response.');
  if(r.ok !== true) throw new Error(r.message || 'Email atau password tidak sah.');
  if(typeof r.token !== 'string' || !r.token) throw new Error('Server tidak mengembalikan session token.');

  TOKEN = r.token;
  localStorage.setItem('ppps19_token', TOKEN);
  await loadPortal();
 }catch(e){
  console.error('LOGIN ERROR:', e);
  showError('loginError', e.message || 'Login gagal.');
 }finally{
  button.disabled = false;
  button.textContent = 'Log Masuk';
 }
}

/* =====================================================
 LOAD PORTAL
====================================================== */
async function loadPortal(){
 if(!TOKEN){ showLogin(); return; }
 document.getElementById('content').innerHTML = loading('Memuatkan portal...');

 try{
  const r = await call('getPortal', TOKEN);
  if(!r) throw new Error('Server tidak mengembalikan response.');
  if(r.ok !== true) throw new Error(r.message || 'Session tidak sah.');
  if(!r.user) throw new Error('Server tidak mengembalikan maklumat user.');

  STATE = r;
  renderShell();
  show(CURRENT_PAGE || 'dashboard');
 }catch(e){
  console.error('LOAD PORTAL ERROR:', e);
  TOKEN = '';
  STATE = null;
  localStorage.removeItem('ppps19_token');
  showLogin();
  showError('loginError', e.message || 'Session telah tamat. Sila login semula.');
 }
}

function showLogin(){
 document.getElementById('app').classList.add('hidden');
 document.getElementById('login').classList.remove('hidden');
 STATE = null;
 const password = document.getElementById('password');
 if(password) password.value = '';
 const email = document.getElementById('email');
 if(email) email.focus();
}

async function doLogout(){
 try{
  if(TOKEN) await call('logout', TOKEN);
 }catch(e){
  console.warn('LOGOUT ERROR:', e);
 }finally{
  TOKEN = '';
  STATE = null;
  localStorage.removeItem('ppps19_token');
  showLogin();
 }
}

function forgotPassword(){
 openModal(`
  <h3>Lupa Password</h3>
  <p class="muted">Masukkan email yang didaftarkan. Jika akaun wujud, sistem akan menghantar kod reset password.</p>
  <div id="resetRequestMsg"></div>
  <label>Email</label>
  <input id="resetEmail" type="email" placeholder="nama@email.com">
  <div class="actions">
   <button class="btn secondary" onclick="closeModal()">Batal</button>
   <button class="btn" onclick="requestResetCode()">Hantar Kod</button>
  </div>
 `);
}

async function requestResetCode(){
 const email = document.getElementById('resetEmail').value.trim();
 if(!email){ showError('resetRequestMsg', 'Sila masukkan email.'); return; }

 try{
  const r = await call('requestPasswordReset', email);
  if(!r) throw new Error('Server tidak mengembalikan response.');
  if(r.ok === false) throw new Error(r.message || 'Permintaan reset gagal.');

  document.getElementById('resetRequestMsg').innerHTML = '<div class="success">' + esc(r.message || 'Kod reset telah dihantar.') + '</div>';
  setTimeout(function(){ showCompleteReset(email); }, 700);
 }catch(e){
  showError('resetRequestMsg', e.message || e);
 }
}

function showCompleteReset(email){
 openModal(`
  <h3>Reset Password</h3>
  <p class="muted">Masukkan kod reset yang diterima dan password baru.</p>
  <div id="completeResetMsg"></div>
  <label>Email</label>
  <input id="completeEmail" value="${esc(email)}" readonly>
  <label>Kod Reset</label>
  <input id="resetCode" maxlength="6" inputmode="numeric" placeholder="123456">
  <label>Password Baru</label>
  <input id="resetNewPassword" type="password" minlength="8">
  <label>Sahkan Password Baru</label>
  <input id="resetConfirmPassword" type="password" minlength="8">
  <div class="actions">
   <button class="btn secondary" onclick="closeModal()">Batal</button>
   <button class="btn" onclick="completeReset()">Reset Password</button>
  </div>
 `);
}

async function completeReset(){
 const email = document.getElementById('completeEmail').value.trim();
 const code = document.getElementById('resetCode').value.trim();
 const password = document.getElementById('resetNewPassword').value;
 const confirm = document.getElementById('resetConfirmPassword').value;

 if(!email || !code || !password){ showError('completeResetMsg', 'Semua ruangan wajib diisi.'); return; }
 if(password.length < 8){ showError('completeResetMsg', 'Password mestilah sekurang-kurangnya 8 aksara.'); return; }
 if(password !== confirm){ showError('completeResetMsg', 'Password baru tidak sepadan.'); return; }

 try{
  const r = await call('completePasswordReset', email, code, password);
  if(!r) throw new Error('Server tidak mengembalikan response.');
  if(r.ok === false) throw new Error(r.message || 'Reset password gagal.');

  showSuccess('completeResetMsg', r.message || 'Password berjaya ditukar.');
  setTimeout(function(){
    closeModal();
    document.getElementById('email').value = email;
    document.getElementById('password').value = '';
    document.getElementById('password').focus();
  }, 1000);
 }catch(e){
  showError('completeResetMsg', e.message || e);
 }
}

function changePassword(){
 if(!TOKEN){ showLogin(); return; }
 openModal(`
  <h3>Tukar Password</h3>
  <div id="changePasswordMsg"></div>
  <label>Password Semasa</label>
  <input id="currentPassword" type="password">
  <label>Password Baru</label>
  <input id="newPassword" type="password" minlength="8">
  <label>Sahkan Password Baru</label>
  <input id="confirmNewPassword" type="password" minlength="8">
  <div class="actions">
   <button class="btn secondary" onclick="closeModal()">Batal</button>
   <button class="btn" onclick="saveMyPassword()">Simpan</button>
  </div>
 `);
}

async function saveMyPassword(){
 const current = document.getElementById('currentPassword').value;
 const password = document.getElementById('newPassword').value;
 const confirm = document.getElementById('confirmNewPassword').value;

 if(!current || !password){ showError('changePasswordMsg', 'Sila lengkapkan semua ruangan.'); return; }
 if(password.length < 8){ showError('changePasswordMsg', 'Password mestilah sekurang-kurangnya 8 aksara.'); return; }
 if(password !== confirm){ showError('changePasswordMsg', 'Password baru tidak sepadan.'); return; }

 try{
  const r = await call('changeMyPassword', TOKEN, current, password);
  if(!r) throw new Error('Server tidak mengembalikan response.');
  if(r.ok === false) throw new Error(r.message || 'Pertukaran password gagal.');
  showSuccess('changePasswordMsg', r.message || 'Password berjaya ditukar.');
 }catch(e){
  showError('changePasswordMsg', e.message || e);
 }
}

async function show(page){
 CURRENT_PAGE = page;
 const c = document.getElementById('content');
 if(!STATE || !STATE.user){ showLogin(); return; }

 try{
  if(page === 'dashboard') c.innerHTML = dashboard();
  else if(page === 'profile') await profile();
  else if(page === 'payments') await payments();
  else if(page === 'receipts') await receipts();
  else if(page === 'members') await members();
  else if(page === 'allpayments') await allPayments();
  else if(page === 'audit') await audit();
  else if(page === 'users') await users();
  else if(page === 'auditlog') await auditLog();
  else if(page === 'health') await health();
 }catch(e){
  console.error('PAGE ERROR:', e);
  c.innerHTML = '<div class="alert">' + esc(e.message || 'Gagal memuatkan halaman.') + '</div>';
 }
}

async function health(){
 const content = document.getElementById('content');
 content.innerHTML = loading('Memeriksa database...');

 try{
  const h = await call('getDatabaseHealth', TOKEN);
  if(!h) throw new Error('Server tidak mengembalikan status database.');

  content.innerHTML = `
   <h2>Database Health</h2>
   <div class="card">
    <p>Spreadsheet: <b>${esc(h.spreadsheetName || '-')}</b></p>
    <p>ID: ${esc(h.spreadsheetId || '-')}</p>
    <p class="${h.ok ? 'health-ok' : 'health-error'}">${h.ok ? '✓ DATABASE HEALTHY' : '✗ DATABASE ERROR'}</p>
   </div>
   <div class="card" style="margin-top:14px">
    <h3>Sheets</h3>
    ${Object.entries(h.sheets || {}).map(function([name, data]){
      return `<p><b>${esc(name)}</b> : ${data && data.exists ? '✓' : '✗'} ${data && data.exists ? ' (' + esc(data.rows) + ' records)' : ''}</p>`;
     }).join('')}
   </div>
   ${h.errors && h.errors.length ? `<div class="alert">${h.errors.map(function(e){ return `<div>${esc(e)}</div>`; }).join('')}</div>` : ''}
  `;
 }catch(e){
  content.innerHTML = `<div class="alert">${esc(e.message || e)}</div>`;
 }
}

function closeModal(){
 document.getElementById('modal').classList.add('hidden');

  if(TOKEN){ loadPortal(); } else { showLogin(); }
