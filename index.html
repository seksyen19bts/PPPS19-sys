<!DOCTYPE html>
<html>
<head>
    <title>PPPS19 Management System</title>
</head>
<body>

    <iframe 
        src="https://script.google.com/macros/s/AKfycbz01R8xI7lDuqoRNQpttX2eB2hKAiDcoXZCcso-xUJCmgx2y6wB3sMTq2CkfLu9tHQ/exec"
        width="100%"
        height="100%"
        allowfullscreen="true"
        style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; border: none;">
    </iframe>

<script>
    window.onload = function() {
        document.querySelector('iframe').requestFullscreen().catch((err) => {
            console.error(`Error attempting to enable full-screen mode: ${err.message}`);
        });
    };
</script>    
</body>
</html>
